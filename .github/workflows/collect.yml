# Scheduled point-in-time data collection.
#
# The repository is the archive: each run appends what changed (availability
# change log, one gzipped market snapshot, the next deadline's ownership,
# elite-panel picks for freshly passed deadlines) under data/collected/ and
# commits it. See acquire/actions.py for the design rules.
#
# Notes:
# * Scheduled workflows only run on the repository's DEFAULT branch — this
#   file must be merged to main before the cron fires.
# * The collector is stdlib-only: no pip install step at all.
# * Four runs a day gives the deadline-decay research T-18h/T-12h/T-6h-ish
#   samples around a typical Saturday 10:30 UTC deadline while staying
#   polite to the FPL API (one bootstrap fetch per run).
name: collect-fpl-data

on:
  schedule:
    - cron: "23 4,10,16,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-fpl-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect
        run: python -m acquire actions-collect

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/collected
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "collect: $(date -u +%FT%TZ)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
